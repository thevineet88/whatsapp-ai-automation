services:
  - type: web
    name: whatsapp-bot-web
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: whatsapp-bot-worker
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci
    startCommand: npm run worker:prod
    autoDeploy: true
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
