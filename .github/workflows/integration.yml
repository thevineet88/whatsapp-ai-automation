name: Integration

on:
  push:
    branches: [main]
  pull_request:

# Never auto-cancel integration — it runs infrequently and we want every
# result even after a follow-up push.
concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: samyati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d samyati_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/samyati_test
      REDIS_URL: redis://localhost:6379
      WHATSAPP_ACCESS_TOKEN: test-token
      WHATSAPP_PHONE_NUMBER_ID: test-id
      WHATSAPP_BUSINESS_ACCOUNT_ID: test-id
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: test-token
      WHATSAPP_APP_SECRET: test-secret
      JINA_API_KEY: test-key
      DEEPSEEK_API_KEY: test-key
      SENTRY_DSN: ""
      LANGFUSE_PUBLIC_KEY: test-key
      LANGFUSE_SECRET_KEY: test-key
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U test; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      # TODO: redis-cli is not installed on GitHub-hosted runners.
      # Re-enable this step once we switch to a Node.js TCP probe or install redis-tools.
      # - name: Wait for Redis
      #   run: |
      #     for i in $(seq 1 30); do
      #       if node -e "require('net').createConnection({port:6379}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; then
      #         echo "Redis is ready"
      #         exit 0
      #       fi
      #       echo "Waiting for Redis... ($i/30)"
      #       sleep 2
      #     done
      #     echo "Redis did not become ready in time"
      #     exit 1

      - name: Drizzle migration check
        # Verifies that the schema and migration files are in sync. Catches
        # schema edits without a matching migration before production deploy.
        run: npx drizzle-kit check

      - name: Run Drizzle migrations
        run: npm run db:migrate

      - name: Run all tests (unit + integration)
        run: npm test
