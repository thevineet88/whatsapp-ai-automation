name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch/ref so a fast-follow-up push
# doesn't pay for two CI runs of the same work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Typecheck, Unit Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Stubbed so `next build` resolves any module that reads process.env at
      # build time. Real values live in the production environment, never in CI.
      DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
      REDIS_URL: redis://localhost:6379
      WHATSAPP_ACCESS_TOKEN: stub
      WHATSAPP_PHONE_NUMBER_ID: stub
      WHATSAPP_BUSINESS_ACCOUNT_ID: stub
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: stub
      JINA_API_KEY: stub
      DEEPSEEK_API_KEY: stub
      SENTRY_DSN: ""
      LANGFUSE_PUBLIC_KEY: stub
      LANGFUSE_SECRET_KEY: stub
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Biome lint
        run: npm run lint

      - name: Unit tests (exclude integration suites)
        # Integration suites spin up testcontainers, which is slow and
        # depends on Docker. They live in integration.yml on its own job so
        # the fast gate stays fast.
        run: npx vitest run --exclude '**/*.integration.test.ts'

      - name: Next.js build
        run: npm run build